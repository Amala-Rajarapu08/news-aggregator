spring:
  application:
    name: pulseai-backend
  profiles:
    default: local
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pulseai}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  environment: ${APP_ENVIRONMENT:local}
  jwt:
    secret-base64: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:pulseai}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5180,http://127.0.0.1:5180}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  ai:
    embedding-model: ${AI_EMBEDDING_MODEL:sentence-transformers/all-MiniLM-L6-v2}
    embedding-backfill-initial-delay-ms: ${AI_EMBEDDING_BACKFILL_INITIAL_DELAY_MS:20000}
    embedding-backfill-interval-ms: ${AI_EMBEDDING_BACKFILL_INTERVAL_MS:60000}
  news:
    rss-feeds: ${NEWS_RSS_FEEDS:}
    image-metadata-enabled: ${NEWS_IMAGE_METADATA_ENABLED:true}
    image-backfill:
      enabled: ${NEWS_IMAGE_BACKFILL_ENABLED:true}
      interval-ms: ${NEWS_IMAGE_BACKFILL_INTERVAL_MS:300000}
      initial-delay-ms: ${NEWS_IMAGE_BACKFILL_INITIAL_DELAY_MS:60000}
      batch-size: ${NEWS_IMAGE_BACKFILL_BATCH_SIZE:8}
      validation-batch-size: ${NEWS_IMAGE_BACKFILL_VALIDATION_BATCH_SIZE:24}
      scan-size: ${NEWS_IMAGE_BACKFILL_SCAN_SIZE:64}
    gnews-key: ${GNEWS_API_KEY:}
    gnews-category: ${GNEWS_CATEGORY:general}
    gnews-categories: ${GNEWS_CATEGORIES:}
    api-key: ${NEWS_API_KEY:}
    api-base-url: ${NEWS_API_BASE_URL:}
    api-country: ${NEWS_API_COUNTRY:us}
    api-categories: ${NEWS_API_CATEGORIES:}
    retention:
      hours: ${NEWS_RETENTION_HOURS:48}
      max-articles: ${NEWS_MAX_CACHED_ARTICLES:2000}
      cleanup-ms: ${NEWS_CLEANUP_INTERVAL_MS:900000}
    ingestion:
      enabled: ${NEWS_INGESTION_ENABLED:false}
      interval-ms: ${NEWS_INGESTION_INTERVAL_MS:3600000}
      initial-delay-ms: ${NEWS_INGESTION_INITIAL_DELAY_MS:5000}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
