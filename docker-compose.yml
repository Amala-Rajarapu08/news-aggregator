services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-pulseai}
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pulseai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pulseai

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${DATABASE_NAME:-pulseai}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      APP_ENVIRONMENT: local
      AI_SERVICE_URL: http://ai-service:8000
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:5180}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-pulseai}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      NEWS_RSS_FEEDS: ${NEWS_RSS_FEEDS:-}
      NEWS_INGESTION_ENABLED: ${NEWS_INGESTION_ENABLED:-false}
      NEWS_INGESTION_INTERVAL_MS: ${NEWS_INGESTION_INTERVAL_MS:-3600000}
      NEWS_RETENTION_HOURS: ${NEWS_RETENTION_HOURS:-48}
      NEWS_MAX_CACHED_ARTICLES: ${NEWS_MAX_CACHED_ARTICLES:-2000}
      NEWS_CLEANUP_INTERVAL_MS: ${NEWS_CLEANUP_INTERVAL_MS:-900000}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_API_BASE_URL: ${NEWS_API_BASE_URL:-https://newsapi.org/v2/top-headlines}
      NEWS_API_COUNTRY: ${NEWS_API_COUNTRY:-us}
      NEWS_API_CATEGORIES: ${NEWS_API_CATEGORIES:-}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      GNEWS_CATEGORY: ${GNEWS_CATEGORY:-general}
      GNEWS_CATEGORIES: ${GNEWS_CATEGORIES:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pulseai

  ai-service:
    build:
      context: ./ai-service
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8000
      EMBEDDING_MODEL_NAME: ${AI_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - pulseai

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api/v1}
    ports:
      - "5180:4173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:4173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - pulseai

volumes:
  pulseai-postgres-data:

networks:
  pulseai:
    driver: bridge
